name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DaybreakGames.Census.slnx

      - name: Build
        run: dotnet build DaybreakGames.Census.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DaybreakGames.Census.slnx --configuration Release --no-build --verbosity normal

      - name: Pack
        run: >
          dotnet pack src/DaybreakGames.Census/DaybreakGames.Census.csproj
          --configuration Release --no-build -o ./pack
          -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
          -p:PackageVersion=${GITHUB_REF_NAME#v}

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish
        run: dotnet nuget push "./pack/*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
