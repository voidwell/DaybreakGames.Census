name: Build & Test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DaybreakGames.Census.slnx

      - name: Lint
        run: dotnet format DaybreakGames.Census.slnx --verify-no-changes --severity warning --no-restore

      - name: Build
        run: dotnet build DaybreakGames.Census.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DaybreakGames.Census.slnx --configuration Release --no-build --verbosity normal
